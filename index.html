<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6f8175" />
    <meta name="description" content="Afterglow OS — a calm, lofi desktop in your browser." />
    <title>Afterglow OS</title>
    <link rel="icon" type="image/png" href="assets/photos/A.png" />
    <link rel="apple-touch-icon" href="assets/photos/A.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="svg-library" aria-hidden="true">
      <symbol id="i-computer" viewBox="0 0 48 48"><path d="M7 7h34v27H7z" fill="#d9d4c3" stroke="#33423f" stroke-width="2"/><path d="M10 10h28v19H10z" fill="#637f79"/><path d="M14 14h16v2H14zm0 5h11v2H14z" fill="#d6c7a6" opacity=".8"/><path d="M19 34h10l2 6H17z" fill="#aaa99f" stroke="#33423f" stroke-width="2"/><path d="M13 40h22v3H13z" fill="#d9d4c3" stroke="#33423f" stroke-width="2"/></symbol>
      <symbol id="i-folder" viewBox="0 0 48 48"><path d="M5 13h15l4 5h19v23H5z" fill="#d19a62" stroke="#3f403a" stroke-width="2"/><path d="M5 18h38v5H5z" fill="#e6b679"/><path d="M8 26h32v12H8z" fill="#dba86d" opacity=".72"/></symbol>
      <symbol id="i-note" viewBox="0 0 48 48"><path d="M10 5h28v38H10z" fill="#eee7d2" stroke="#3e4542" stroke-width="2"/><path d="M16 14h16M16 20h16M16 26h12M16 32h14" stroke="#81958b" stroke-width="2"/><path d="M33 5h5v5" fill="#bfc9bd"/></symbol>
      <symbol id="i-bin" viewBox="0 0 48 48"><path d="M13 14h22l-2 29H15z" fill="#b8c6bf" stroke="#364541" stroke-width="2"/><path d="M10 10h28v5H10zM19 6h10v4H19z" fill="#d9ded8" stroke="#364541" stroke-width="2"/><path d="M19 20v16m5-16v16m5-16v16" stroke="#71887e" stroke-width="2"/></symbol>
      <symbol id="i-document" viewBox="0 0 48 48"><path d="M10 5h21l7 7v31H10z" fill="#f1ebd8" stroke="#3e4542" stroke-width="2"/><path d="M31 5v8h7" fill="#c9d0c5" stroke="#3e4542" stroke-width="2"/><path d="M16 21h16M16 27h16M16 33h12" stroke="#85978d" stroke-width="2"/></symbol>
      <symbol id="i-headphones" viewBox="0 0 48 48"><path d="M8 27v-5a16 16 0 0132 0v5" fill="none" stroke="#35433f" stroke-width="4"/><rect x="5" y="25" width="9" height="15" rx="3" fill="#c77a62" stroke="#35433f" stroke-width="2"/><rect x="34" y="25" width="9" height="15" rx="3" fill="#c77a62" stroke="#35433f" stroke-width="2"/></symbol>
      <symbol id="i-chrome" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#f2eee0" stroke="#344440" stroke-width="2"/><path d="M24 24L42 24A18 18 0 0033 8.4L24 24z" fill="#d76368"/><path d="M24 24L33 39.6A18 18 0 014.8 19L24 24z" fill="#d6ad67"/><path d="M24 24L4.8 19A18 18 0 0133 8.4L24 24z" fill="#6f9a78"/><circle cx="24" cy="24" r="9" fill="#547f91" stroke="#f4eee0" stroke-width="3"/><circle cx="21" cy="21" r="3" fill="#a9cad0" opacity=".75"/></symbol>
      <symbol id="i-minesweeper" viewBox="0 0 48 48"><path d="M5 5h38v38H5z" fill="#d5d1c4" stroke="#344440" stroke-width="2"/><path d="M8 8h10v10H8zm11 0h10v10H19zm11 0h10v10H30zM8 19h10v10H8zm22 0h10v10H30zM8 30h10v10H8zm11 0h10v10H19zm11 0h10v10H30z" fill="#78938b" stroke="#f4eee0"/><circle cx="24" cy="24" r="7" fill="#283a39"/><path d="M24 13v5m0 12v5M13 24h5m12 0h5m-18-7l4 4m6 6l4 4m0-14l-4 4m-6 6l-4 4" stroke="#df7379" stroke-width="2"/><circle cx="22" cy="22" r="2" fill="#f4e6c7"/></symbol>
      <symbol id="i-fishing" viewBox="0 0 48 48"><path d="M5 8h38v33H5z" fill="#1c4a50" stroke="#334440" stroke-width="2"/><path d="M6 25c7-4 11 3 18-1s11 3 18-1v17H6z" fill="#2c6970"/><path d="M6 31c7-4 11 3 18-1s11 3 18-1M6 36c7-4 11 3 18-1s11 3 18-1" fill="none" stroke="#82a8a3" stroke-width="1.5"/><path d="M35 9c-8 4-11 12-11 19" fill="none" stroke="#e6d2a3" stroke-width="2"/><path d="M35 9l4-3" stroke="#9a6b4e" stroke-width="3" stroke-linecap="round"/><path d="M24 27v5" stroke="#eee4c9"/><circle cx="24" cy="34" r="3" fill="#df7379"/><path d="M8 19l8-8 8 8zM24 19l7-7 7 7z" fill="#17383d" opacity=".9"/></symbol>
      <symbol id="i-snake" viewBox="0 0 48 48"><rect x="5" y="5" width="38" height="38" rx="3" fill="#102e35" stroke="#334440" stroke-width="2"/><path d="M10 15h10v8h10v9h9" fill="none" stroke="#70b49f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 14h9v7" fill="none" stroke="#a1d2bb" stroke-width="2" stroke-linecap="round" opacity=".8"/><rect x="34" y="27" width="8" height="10" rx="3" fill="#efbf70" stroke="#f4e6bd"/><circle cx="39" cy="30" r="1" fill="#263b3a"/><circle cx="12" cy="36" r="4" fill="#e9767f" stroke="#f2c09c"/><path d="M12 32c0-4 4-5 6-6" fill="none" stroke="#80a98c" stroke-width="2"/></symbol>
      <symbol id="i-gallery" viewBox="0 0 48 48"><path d="M7 10h34v29H7z" fill="#e8e1cf" stroke="#344440" stroke-width="2"/><path d="M10 13h28v23H10z" fill="#315d62"/><circle cx="31" cy="20" r="4" fill="#efbe76"/><path d="M10 34l9-10 6 6 5-5 8 9v2H10z" fill="#78998c"/><path d="M19 24l6 6-3 3-7-4z" fill="#a7baaa" opacity=".7"/><path d="M12 7h29v29" fill="none" stroke="#f4edda" stroke-width="2" opacity=".75"/></symbol>
      <symbol id="i-calculator" viewBox="0 0 48 48"><rect x="9" y="5" width="30" height="38" rx="2" fill="#c9cec4" stroke="#344440" stroke-width="2"/><rect x="13" y="9" width="22" height="9" fill="#6f8c82" stroke="#40504b"/><path d="M14 23h5v5h-5zm8 0h5v5h-5zm8 0h5v5h-5zM14 31h5v5h-5zm8 0h5v5h-5z" fill="#edf0e7" stroke="#6a756f"/><path d="M30 31h5v5h-5z" fill="#df777d" stroke="#805055"/><path d="M14 39h13" stroke="#e6b970" stroke-width="4"/></symbol>
      <symbol id="i-start" viewBox="0 0 32 32"><path d="M4 5h11v11H4zm13 0h11v11H17zM4 18h11v9H4zm13 0h11v9H17z" fill="#e8dfc8"/><path d="M6 7h7v7H6zm13 0h7v7h-7zM6 20h7v5H6zm13 0h7v5h-7z" fill="#92aa9e"/></symbol>
    </svg>

    <main id="desktop" class="desktop" aria-label="Afterglow desktop">
      <div class="rain-wallpaper" aria-hidden="true"></div>
      <div class="sky-grain"></div>
      <div class="sun-haze"></div>
      <div class="landscape landscape-back"></div>
      <div class="landscape landscape-front"></div>
      <div class="power-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <section id="desktop-icons" class="desktop-icons" aria-label="Desktop icons"></section>

      <aside id="cassette-player" class="now-playing" aria-label="Raining in Osaka cassette player">
        <div id="cassette-button" class="cassette-art" role="button" tabindex="0" aria-label="Play Raining in Osaka">
          <span class="tape-label">SIDE A</span>
          <div class="tape-window"><i></i><i></i></div>
          <span class="tape-title">osaka rain</span>
        </div>
        <div class="track-copy">
          <span class="eyebrow">NOW PLAYING</span>
          <strong>Raining in Osaka</strong>
          <span>rainy night mix · local cassette</span>
          <div id="track-seek" class="track-line" role="slider" tabindex="0" aria-label="Seek through Raining in Osaka" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="track-progress"></i></div>
          <div class="track-details"><span>LOFI / OSAKA</span><time id="track-time">0:00 / 19:11</time></div>
        </div>
        <div class="player-controls">
          <button id="volume-button" class="round-button volume-button" aria-label="Adjust cassette volume" aria-expanded="false">♫</button>
          <div id="volume-popover" class="volume-popover hidden">
            <input id="volume-slider" type="range" min="0" max="100" value="78" aria-label="Cassette volume" />
            <span id="volume-value">78%</span>
          </div>
          <button id="play-button" class="round-button" aria-label="Play Raining in Osaka">▶</button>
        </div>
        <audio id="lofi-audio" src="assets/audio/RAINING IN ＯＳＡＫＡ.mp3" preload="auto" autoplay loop></audio>
      </aside>

      <div id="window-layer" class="window-layer" aria-live="polite"></div>
      <div id="context-menu" class="context-menu hidden" role="menu"></div>
      <div id="toast-region" class="toast-region" aria-live="polite"></div>

      <section id="start-menu" class="start-menu hidden" aria-label="Start menu">
        <div class="start-sidebar"><span>AFTERGLOW</span></div>
        <div class="start-content">
          <header>
            <div class="user-avatar">A</div>
            <div><strong>evening, friend</strong><span>Afterglow local desktop</span></div>
          </header>
          <div class="start-search-wrap"><span aria-hidden="true">⌕</span><input id="start-search" type="search" placeholder="Find a program..." autocomplete="off" aria-label="Find a program" /></div>
          <div class="start-columns">
            <nav class="start-programs" aria-label="Programs">
              <p class="start-section-label">PINNED PROGRAMS</p>
              <button data-start-action="gallery" data-start-search="rainy motel gallery photos image viewer"><svg><use href="#i-gallery"/></svg><span><b>Rainy Motel Gallery</b><small>Browse the night collection</small></span></button>
              <button data-start-action="calculator" data-start-search="calculator math"><svg><use href="#i-calculator"/></svg><span><b>Calculator</b><small>Standard desktop calculator</small></span></button>
              <button data-start-action="notes" data-start-search="notepad notes text editor"><svg><use href="#i-note"/></svg><span><b>Notepad</b><small>Write something down</small></span></button>
              <button data-start-action="chrome" data-start-search="google chrome browser web internet"><svg><use href="#i-chrome"/></svg><span><b>Google Chrome</b><small>Browse inside the desktop</small></span></button>
              <button data-start-action="minesweeper" data-start-search="night mines minesweeper game"><svg><use href="#i-minesweeper"/></svg><span><b>Night Mines</b><small>Rainy Minesweeper</small></span></button>
              <button data-start-action="fishing" data-start-search="rainy lake fishing game"><svg><use href="#i-fishing"/></svg><span><b>Rainy Lake Fishing</b><small>Cast a line by the motel</small></span></button>
              <button data-start-action="snake" data-start-search="neon snake game"><svg><use href="#i-snake"/></svg><span><b>Neon Snake</b><small>Run the night grid</small></span></button>
              <div id="start-empty" class="start-empty hidden">No programs found.</div>
            </nav>
            <aside class="start-places" aria-label="Places and system links">
              <button data-start-action="computer"><svg><use href="#i-computer"/></svg><b>My Computer</b></button>
              <button data-start-action="documents"><svg><use href="#i-folder"/></svg><b>My Documents</b></button>
              <button data-start-action="gallery"><svg><use href="#i-gallery"/></svg><b>My Pictures</b></button>
              <button data-start-action="music"><svg><use href="#i-headphones"/></svg><b>Lofi Player</b></button>
              <hr />
              <button data-start-action="recycle"><svg><use href="#i-bin"/></svg><b>Recycle Bin</b></button>
              <button data-start-action="about"><span class="start-link-glyph">?</span><b>About</b></button>
            </aside>
          </div>
          <footer><span>LOCAL SESSION</span><button data-start-action="sleep">☾ &nbsp; Rest</button></footer>
        </div>
      </section>

      <footer class="taskbar">
        <button id="start-button" class="start-button" aria-expanded="false"><svg><use href="#i-start"/></svg><span>afterglow</span></button>
        <div class="taskbar-divider"></div>
        <nav class="quick-launch" aria-label="Quick launch">
          <button data-quick-action="computer" title="File Explorer"><svg><use href="#i-folder"/></svg></button>
          <button data-quick-action="gallery" title="Rainy Motel Gallery"><svg><use href="#i-gallery"/></svg></button>
          <button data-quick-action="calculator" title="Calculator"><svg><use href="#i-calculator"/></svg></button>
          <button data-quick-action="desktop" title="Show desktop" aria-label="Show desktop"><span>▣</span></button>
        </nav>
        <div class="taskbar-divider"></div>
        <div id="task-items" class="task-items"></div>
        <div class="tray">
          <span id="tray-status" class="tray-status" title="Afterglow is running"><i></i></span>
          <button id="sound-toggle" aria-label="Toggle sound">♫</button>
          <span class="tray-divider"></span>
          <button id="clock-button" class="clock-button" aria-expanded="false" aria-label="Open date and time"><time id="clock"></time></button>
        </div>
        <button id="taskbar-peek" class="taskbar-peek" title="Show desktop" aria-label="Show desktop"></button>
      </footer>

      <aside id="calendar-popover" class="calendar-popover hidden" aria-label="Date and time">
        <header><time id="calendar-time"></time><span id="calendar-full-date"></span></header>
        <div class="calendar-month"><button data-calendar-shift="-1" aria-label="Previous month">‹</button><strong id="calendar-month-label"></strong><button data-calendar-shift="1" aria-label="Next month">›</button></div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </aside>
    </main>

    <template id="window-template">
      <article class="app-window" tabindex="-1">
        <header class="titlebar">
          <div class="title-copy"><span class="title-icon"></span><strong class="window-title"></strong></div>
          <div class="window-controls">
            <button data-control="minimize" aria-label="Minimize">_</button>
            <button data-control="maximize" aria-label="Maximize">□</button>
            <button data-control="close" aria-label="Close">×</button>
          </div>
        </header>
        <div class="window-content"></div>
        <div class="resize-handle"></div>
      </article>
    </template>

    <script src="minesweeper.js"></script>
    <script src="fishing.js"></script>
    <script src="snake.js"></script>
    <script src="app.js"></script>
  </body>
</html>
